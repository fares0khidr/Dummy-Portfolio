<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <style>
    body { background: #eef1ff; font-family: Arial, sans-serif; padding: 30px; }
    .card { background: white; max-width: 600px; margin: auto; padding: 24px; border-radius: 14px; }
    h2 { margin-top: 0; }
    .top { display: flex; gap: 10px; }
    #input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    #add { background: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; font-size: 13px; color: #667; }
    .filter { background: none; border: none; padding: 6px 10px; border-radius: 12px; cursor: pointer; font-weight: bold; }
    .filter.active { background: #dbeafe; color: #3b82f6; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-top: 1px solid #eee; }
    li span, .edit { flex: 1; }
    .done { text-decoration: line-through; color: #999; }
    .del { background: none; border: none; cursor: pointer; }
    .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 12px; font-size: 13px; color: #667; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Todo App</h2>
    <div class="top">
      <input id="input" placeholder="What needs doing?">
      <button id="add">Add</button>
    </div>
    <div class="bar">
      <span>Tip: double-click a todo to edit. Press Enter to save.</span>
      <div>
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </div>
    <ul id="list"></ul>
    <div class="footer">
      <span id="count">0 items left</span>
      <div>
        <button id="clear-done">Clear completed</button>
        <button id="clear-all">Clear all</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
