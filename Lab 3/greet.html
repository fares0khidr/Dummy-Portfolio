<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greet & Goodbye Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #cfe6fb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        text-align: center;
        width: 280px;
      }
      .input-area {
        display: flex;
        gap: 6px;
      }
      input {
        flex: 1;
        padding: 6px;
      }
      button {
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #e3f2fd;
        margin-top: 6px;
        padding: 4px;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title">Welcome</h1>
      <div class="input-area">
        <input id="name" placeholder="Your name" />
        <button id="greet">Greet</button>
      </div>
      <ul id="list"></ul>
    </div>

    <script>
      const title = document.getElementById("title");
      const input = document.getElementById("name");
      const list = document.getElementById("list");

      document.getElementById("greet").addEventListener("click", () => {
        const name = input.value.trim();
        if (!name) alert("You did not write a name!");

        const li = document.createElement("li");
        li.textContent = name;

        li.addEventListener("click", () => {
          title.textContent = "Goodbye, " + name + "!";
          li.remove();
        });

        list.appendChild(li);
        title.textContent = "Hello, " + name + "!";
        input.value = "";
      });
    </script>
  </body>
</html>
